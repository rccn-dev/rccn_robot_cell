# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    east_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    west_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    east_on_rail_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    west_on_rail_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    dual_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

east_controller:
  ros__parameters:
    joints:
      - east_joint_a1
      - east_joint_a2
      - east_joint_a3
      - east_joint_a4
      - east_joint_a5
      - east_joint_a6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
west_controller:
  ros__parameters:
    joints:
      - west_joint_a1
      - west_joint_a2
      - west_joint_a3
      - west_joint_a4
      - west_joint_a5
      - west_joint_a6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
east_on_rail_controller:
  ros__parameters:
    joints:
      - east_joint_e1
      - east_joint_a1
      - east_joint_a2
      - east_joint_a3
      - east_joint_a4
      - east_joint_a5
      - east_joint_a6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
west_on_rail_controller:
  ros__parameters:
    joints:
      - west_joint_e1
      - west_joint_a1
      - west_joint_a2
      - west_joint_a3
      - west_joint_a4
      - west_joint_a5
      - west_joint_a6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
dual_controller:
  ros__parameters:
    joints:
      - east_joint_e1
      - east_joint_a1
      - east_joint_a2
      - east_joint_a3
      - east_joint_a4
      - east_joint_a5
      - east_joint_a6
      - west_joint_e1
      - west_joint_a1
      - west_joint_a2
      - west_joint_a3
      - west_joint_a4
      - west_joint_a5
      - west_joint_a6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true