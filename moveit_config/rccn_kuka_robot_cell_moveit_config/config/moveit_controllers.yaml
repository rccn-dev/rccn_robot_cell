# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - east_controller
    - west_controller
    - east_on_rail_controller
    - west_on_rail_controller
    - dual_controller

  east_controller:
    type: FollowJointTrajectory
    joints:
      - east_joint_a1
      - east_joint_a2
      - east_joint_a3
      - east_joint_a4
      - east_joint_a5
      - east_joint_a6
  west_controller:
    type: FollowJointTrajectory
    joints:
      - west_joint_a1
      - west_joint_a2
      - west_joint_a3
      - west_joint_a4
      - west_joint_a5
      - west_joint_a6
  east_on_rail_controller:
    type: FollowJointTrajectory
    joints:
      - east_joint_e1
      - east_joint_a1
      - east_joint_a2
      - east_joint_a3
      - east_joint_a4
      - east_joint_a5
      - east_joint_a6
  west_on_rail_controller:
    type: FollowJointTrajectory
    joints:
      - west_joint_e1
      - west_joint_a1
      - west_joint_a2
      - west_joint_a3
      - west_joint_a4
      - west_joint_a5
      - west_joint_a6
  dual_controller:
    type: FollowJointTrajectory
    joints:
      - east_joint_e1
      - east_joint_a1
      - east_joint_a2
      - east_joint_a3
      - east_joint_a4
      - east_joint_a5
      - east_joint_a6
      - west_joint_e1
      - west_joint_a1
      - west_joint_a2
      - west_joint_a3
      - west_joint_a4
      - west_joint_a5
      - west_joint_a6